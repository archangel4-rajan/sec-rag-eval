[project]
name = "sec-rag-eval"
version = "0.1.0"
description = "An evaluation-first RAG system over SEC 10-K filings"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Rajan Anand" }]
license = { text = "MIT" }

dependencies = [
    # Ingestion
    "sec-edgar-downloader>=5.0.3",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.2.2",
    "tqdm>=4.66.4",
    # Retrieval & generation
    "chromadb>=0.5.0",
    "openai>=1.40.0",
    "anthropic>=0.34.0",
    "tiktoken>=0.7.0",
    # Service layer
    "fastapi>=0.112.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    # Eval (added in later phases but pinned now)
    "ragas>=0.1.21",
    "datasets>=2.20.0",
    # Utilities
    "python-dotenv>=1.0.1",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
    "ipykernel>=6.29.0",
]

[project.scripts]
sec-rag = "sec_rag.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sec_rag"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
